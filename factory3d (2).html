button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}

label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--mut)}
.ok{--c:#1e9e5a}.warn{--c:#d98a00}.bad{--c:#d64545}.off{--c:#7a828c}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;color:#fff;background:var(--c)}

.card .h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}

.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--c)}
.note{color:var(--mut);font-size:13px;margin-top:6px}
#sun{width:150px}
.embed h1,.embed p.t{display:none}.embed main{padding:0}.embed canvas{height:calc(100vh - 250px);min-height:280px}

function stat(id){
 if(!S||stale())return{t:'No data',k:'off',rows:[],note:''};
 if(id.startsWith('panel')){const p=S.panels[+id.slice(5)-1],[t,k]=p.v>=2.5?['Generating','ok']:p.v>=1.5?['Low light','warn']:['Dark','off'];
  return{t,k,rows:[['Voltage',p.v.toFixed(2)+' V'],['Output',Math.round(p.rel)+'% of full sun']],note:'Charges the battery through the TP4056 when the light is strong.'};}
 if(id==='battery'){const b=S.battery,[t,k]=b.pct>=99.5?['Full','ok']:b.charging?['Charging','ok']:b.pct<20?['Low','bad']:['Discharging','warn'];
  return{t,k,rows:[['Voltage',b.v.toFixed(2)+' V'],['Charge',Math.round(b.pct)+'%<div class="bar '+k+'"><i style="width:'+Math.round(b.pct)+'%"></i></div>']],note:'Powers the ESP32 and servo when the light is low.'};}
 if(id==='conveyor'){const c=S.conveyor;return{t:c.running?'Running':'Stopped',k:c.running?'ok':'off',rows:[['Speed',Math.round(c.speed)+'%'],['Power source',c.mode],['Direction',c.dir]],note:'Slows down on battery power to save energy.'};}
 const e=S.ev;return{t:e.charging?'Charging':'Not charging',k:e.charging?'ok':'bad',rows:[['Indicator LED',e.charging?'Green':'Red'],['Reason',e.reason||'-']],note:'Charges only when there is spare energy.'};
}
function renderUI(){
 const ch=$('chips');if(!ch.children.length)EL.forEach(a=>{const b=document.createElement('button');b.dataset.id=a[0];b.innerHTML='<span class="dot off"></span><span>'+a[1]+'</span>';b.onclick=()=>select(a[0]);ch.appendChild(b);});
 [...ch.children].forEach(b=>{const s=stat(b.dataset.id);b.querySelector('.dot').className='dot '+s.k;b.classList.toggle('on',b.dataset.id===sel);});
 const card=$('card');
 if(!sel){card.innerHTML='<b>Pick a part</b><div class="note">Click a part in the model or one of the buttons above to see its status.'+(S&&!stale()?' Sunlight is '+Math.round(S.sun)+'%.':'')+'</div>';}
 else{const s=stat(sel),name=EL.find(a=>a[0]===sel)[1];
  card.innerHTML='<div class="h"><b>'+name+'</b><span class="badge '+s.k+'">'+s.t+'</span></div>'+(s.rows.length?'<table>'+s.rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>':'<div class="note">Waiting for a reading.</div>')+(s.note?'<div class="note">'+s.note+'</div>':'');}
 const sb=$('src');sb.textContent=mode==='sim'?'Simulated data':stale()?'No data':'Live data';sb.className='badge '+(mode==='sim'?'warn':stale()?'off':'ok');
 $('sun').disabled=mode!=='sim'||cyc;$('cyc').disabled=mode!=='sim';$('sunv').textContent=(S?Math.round(S.sun):0)+'%';
}
function setHL(){
 if(hl){Sc.remove(hl);hl=null;}M.forEach(m=>{if(m.material.emissive)m.material.emissive.setHex(0);});
 if(!sel)return;const b=new THREE.Box3();
 M.filter(m=>m.userData.el===sel&&!m.userData.prod).forEach(m=>{if(m.material.emissive)m.material.emissive.setHex(0x3a3410);b.expandByObject(m);});
 b.expandByScalar(2);hl=new THREE.Box3Helper(b,0xffc400);Sc.add(hl);
}
function select(id){sel=sel===id?null:id;setHL();renderUI();}
function apply3D(dt){
 const ok=S&&!stale();
 PAN.forEach((m,i)=>{const rel=ok?S.panels[i].rel:0;m.material.color.setHex(0x1a2a4a).lerp(new THREE.Color(0x2f6fd6),rel/100);});
 const ev=ok&&S.ev.charging;LED[0].material.color.setHex(ev?0x2ecc71:0x1d4d33);LED[1].material.color.setHex(ev?0x5a1f1f:0xe74c3c);
 l1.intensity=0.35+0.55*(ok?S.sun/100:0.4);
 const v=ok&&S.conveyor.running?70*S.conveyor.speed/100:0;
 PR.forEach(m=>{m.position.x+=v*dt;if(m.position.x>222)m.position.x-=196;});
}
const tgt=new THREE.Vector3(150,40,-100);let th=Math.PI-0.6,ph=0.5,dist=620;
function upd(){cam.position.set(tgt.x+dist*Math.cos(ph)*Math.sin(th),tgt.y+dist*Math.sin(ph),tgt.z+dist*Math.cos(ph)*Math.cos(th));cam.lookAt(tgt);}
function size(){const w=cv.clientWidth||800,h=cv.clientHeight||450;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(size).observe(cv);
const rc=new THREE.Raycaster(),pt=new THREE.Vector2();
function pick(e){const r=cv.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(pt,cam);
 const h=rc.intersectObjects(M.filter(m=>m.visible),false)[0];return h?h.object.userData.el:null;}
const ps=new Map();let moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY]);if(ps.size===1)moved=0;cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{
 if(!ps.has(e.pointerId)){cv.style.cursor=pick(e)?'pointer':'grab';return;}
 const p=ps.get(e.pointerId);moved+=Math.abs(e.clientX-p[0])+Math.abs(e.clientY-p[1]);
 if(ps.size===1){th-=(e.clientX-p[0])*0.008;ph=clamp(ph+(e.clientY-p[1])*0.008,0.05,1.52);}
 else if(ps.size===2){const o=[...ps.entries()].find(a=>a[0]!==e.pointerId)[1];const d0=Math.hypot(p[0]-o[0],p[1]-o[1]),d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);if(d1>0)dist=clamp(dist*d0/d1,120,1000);}
 ps.set(e.pointerId,[e.clientX,e.clientY]);});
const up=e=>{const wasOne=ps.size===1;ps.delete(e.pointerId);cv.style.cursor='grab';if(e.type==='pointerup'&&wasOne&&moved<6){const id=pick(e);if(id)select(id);else if(sel)select(sel);}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*(1+e.deltaY*0.001),120,1000);},{passive:false});
const V=(a,b,c)=>()=>{th=a;ph=b;dist=c;};
$('v1').onclick=V(Math.PI-0.6,0.5,620);$('v2').onclick=V(Math.PI,1.52,620);$('v3').onclick=V(Math.PI,0.12,560);
$('v4').onclick=V(0,0.12,560);$('v5').onclick=V(-Math.PI/2,0.12,560);$('v6').onclick=V(Math.PI/2,0.12,560);
$('troof').onchange=e=>O.roof.forEach(m=>m.visible=e.target.checked);$('tpan').onchange=e=>O.panel.forEach(m=>m.visible=e.target.checked);
$('cyc').onchange=e=>{cyc=e.target.checked;};
window.SunShine={update(r){live=r;liveAt=performance.now();mode='live';},simulate(){mode='sim';live=null;}};
window.addEventListener('message',e=>{if(e.data&&e.data.type==='sunshine-reading')window.SunShine.update(e.data.reading);});
let last=performance.now(),acc=1;
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;
 if(mode==='sim')simStep(dt);else S=fromLive();
 apply3D(dt);acc+=dt;if(acc>0.2){acc=0;renderUI();}
 upd();R.render(Sc,cam);requestAnimationFrame(frame);}
size();requestAnimationFrame(frame);
</script></body></html>
